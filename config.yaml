usuario:
  areas:
    - Direito
    - Inteligência Artificial
  tipos_vaga:
    - professor
    - pesquisador
    - pós-doutorado
  instituicoes:
    - publica_federal
    - publica_estadual
    - publica_municipal
    - privada
  estados:
    - SP
    - RJ
    - MG
  modalidade: indiferente
  titulacao: indiferente
  incluir_vencidas: false
  alerta:
    canal: telegram        # telegram | discord | email | nenhum
    frequencia: diaria

busca:
  dias_retroativos: 30
  max_resultados_por_fonte: 100
  confirmar_em_fonte_oficial: true
  baixar_pdfs: false

fontes:
  dou: true
  querido_diario: true
  fapesp: true
  universidades_publicas: true
  universidades_privadas: true
  busca_aberta: false  # ponytail: Bing/DDG servem captcha a scrapers; ligue só se plugar uma API de busca (ex.: SerpAPI free tier)
  gupy: true           # privadas (Anhanguera, Estácio, FMU etc.) via API pública do Gupy
  vagas_com: true      # privadas fora do Gupy via Vagas.com.br
  anpof: true          # agenda de concursos da ANPOF — melhor fonte para filosofia

termos_base:
  - "professor substituto"
  - "professor efetivo"
  - "concurso docente"
  - "concurso público de provas e títulos"   # como editais federais de docente se intitulam
  - "provas e títulos"
  - "seleção pública simplificada"
  - "processo seletivo docente"
  - "professor visitante"
  - "professor colaborador"
  - "docente"
  - "pesquisador"
  - "pesquisador bolsista"
  - "bolsa de pós-doutorado"
  - "pós-doutorado"
  - "postdoctoral fellowship"
  - "postdoc"
  - "research fellow"
  - "edital professor"
  - "edital docente"
  - "processo seletivo professor"
  - "vaga professor universitário"
  - "trabalhe conosco professor"
  - "carreira docente"
  - "faculty position"
  - "research position"

