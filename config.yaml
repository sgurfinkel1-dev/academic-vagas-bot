  # entao acrescentar instituicao aqui e configuracao, nao codigo: URL que nao
  # resolve nao rende nada e aparece com 0 no log por pagina.
  # URLs conferidas contra os sites reais em 12/08/2026. Fora da lista, testadas
  # e sem substituto: PUC-Rio (404), PUC-RS e PUC-PR (vaga só no Gupy), Insper
  # (página JS sem links), FGV central e FGV Direito SP (TLS incompatível com
