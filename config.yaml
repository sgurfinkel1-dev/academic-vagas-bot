    url: https://concursos.pr4.ufrj.br/
  - nome: UFMG
    url: https://www.ufmg.br/concursos/
  - nome: USP
    url: https://uspdigital.usp.br/gr/admissao
  - nome: UNICAMP
    url: https://www.dgrh.unicamp.br/concursos
  - nome: UNESP
    url: https://unesp.br/portal#!/apps/concursos-publicos/
  - nome: UERJ
    url: https://www.uerj.br/institucional/concursos/
  - nome: UFRGS
    url: https://progesp.ufrgs.br/concursos

alertas:
  telegram:
    bot_token: ""       # env TELEGRAM_BOT_TOKEN tem precedência
    chat_id: ""
  discord:
    webhook_url: ""     # env DISCORD_WEBHOOK_URL
  email:
    smtp_host: smtp.gmail.com
    smtp_port: 587
    usuario: ""         # env SMTP_USER / SMTP_PASS
    destinatario: ""
