usuario:
  areas:
    - Direito
    - Inteligência Artificial
  tipos_vaga:
    - professor
    - pesquisador
    - pós-doutorado
  instituicoes:
    - publica_federal
    - publica_estadual
    - publica_municipal
    - privada
  estados:
    - SP
    - RJ
    - MG
  modalidade: indiferente
  titulacao: indiferente
  incluir_vencidas: false
  alerta:
    canal: telegram        # telegram | discord | email | nenhum
    frequencia: diaria

busca:
  dias_retroativos: 30
  max_resultados_por_fonte: 500
  confirmar_em_fonte_oficial: true
  baixar_pdfs: false

fontes:
  dou: true
  inlabs: true         # DOU oficial em XML; exige INLABS_EMAIL/INLABS_SENHA no ambiente
  querido_diario: true
  # Diários oficiais estaduais — onde sai o edital de universidade estadual
  doe_sp: true         # USP, Unicamp, UNESP, Centro Paula Souza
  doe_mg: true         # UEMG, Unimontes
  doe_pr: true         # UEL, UEM, UEPG, UNIOESTE, UNICENTRO, UENP, UNESPAR
  doe_rj: true         # UERJ, UENF (diário em PDF; exige pymupdf)
  doe_rs: true         # UERGS (baixa frequência: abre em lote, a cada ~2 anos)
  doe_sc: true         # UDESC
  # Faltam RJ, ES e GO. Situação apurada em 13/08/2026, para quem retomar:
  #  RJ  ioerj.com.br responde 200; módulo nunca foi escrito. É o que falta de
  #      mais valioso — UERJ e UENF são estaduais.
  #  ES  ioes.dio.es.gov.br usa a MESMA plataforma do PR/GO. Contrato verificado:
  #      /busca/busca/buscar/query/{pág0}/di:AAAA-MM-DD/df:AAAA-MM-DD/?1=1&q=termo
  #      devolve Elasticsearch cru (hits.total 1.544 em 60 dias) e o _source tem
  #      exatamente os campos do DOE-PR. Não entrou por dois motivos: a busca é
  #      OR (termo tem de ir entre aspas, senão "universidade estadual" dá 23 mil
  #      acertos), o índice mistura o diário MUNICIPAL (já coberto pelo Querido
  #      Diário) e, sobretudo, o ES não tem universidade estadual relevante — a
  #      UFES é federal e já entra pelo DOU/INLABS. Prioridade baixa.
  #  GO  diariooficial.abc.go.gov.br, mesma plataforma. Módulo foi escrito e
  #      removido: devolvia zero em toda janela testada, inclusive 650 dias
  #      cobrindo o concurso da UEG de 11/2024. Ver o commit que o removeu.
  fapesp: true
  universidades_publicas: true
  universidades_privadas: true
  busca_aberta: false  # ponytail: Bing/DDG servem captcha a scrapers; ligue só se plugar uma API de busca (ex.: SerpAPI free tier)
  gupy: true           # privadas (Anhanguera, Estácio, FMU etc.) via API pública do Gupy
  vagas_com: true      # privadas fora do Gupy via Vagas.com.br
  anpof: true          # agenda de concursos da ANPOF — melhor fonte para filosofia

