name: Testes

# Roda em todo push e pull request. Sem isto, a suíte só roda quando alguém
# lembra de digitar o comando — e uma suíte que ninguém roda apodrece em
# silêncio até o dia em que o painel quebra para quem depende dele.
on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements-dev.txt
      # `not rede` deixa de fora o teste que baixa a listagem da ANPOF: ele
      # depende de site de terceiro, que hoje responde 403 a runner de
      # datacenter. Para rodar tudo, inclusive esse: pytest (sem o -m).
      - name: pytest
        run: python -m pytest -v -m "not rede"
