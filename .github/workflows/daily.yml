name: Busca diária de vagas acadêmicas

on:
  schedule:
    - cron: "0 10 * * *"   # 07:00 BRT
  workflow_dispatch:
    inputs:
      palavra:
        description: "Área/palavra para busca dirigida (vazio = busca completa)"
        required: false
        default: ""
      modo:
        description: "geral (privadas + municipais) | diarios (DOU + municipais) | diarios_completo (DOU + INLABS + DOEs)"
        required: false
        default: "geral"
      email_teste:
        description: "Envia só um e-mail de teste (valida SMTP) e sai"
        type: boolean
        required: false
        default: false

jobs:
  buscar:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt
      - run: scrapling install || python -m playwright install --with-deps chromium

      # Portão antes de publicar: o robô commita direto na main e o painel lê
      # de lá. Sem isto, um src/ quebrado publica resultado quebrado por cima
      # da coleta boa, e quem usa o painel vê o estrago antes de qualquer um
      # de nós. Falhou, não busca e não commita.
      - name: Testes antes de publicar
        run: python -m pytest -m "not rede" -q

      # Os testes de rede batem nos sites de verdade. Não podem barrar a
      # coleta — site de terceiro fora do ar não é bug nosso —, mas aqui é o
      # único lugar com rede real, então rodam e ficam registrados no log:
      # é assim que se descobre que um parser de fonte parou de casar.
      - name: Fontes ao vivo (não barra a coleta)
        continue-on-error: true
        run: python -m pytest -m "rede" -q

      - name: Executar busca
        # palavra/modo vão por env (não interpolados no shell) para evitar injeção,
        # já que qualquer usuário do dashboard pode disparar este workflow.
        run: |
          if [ "$EMAIL_TESTE" = "true" ]; then
            python -m src.main --email-teste
          elif [ -n "$PALAVRA" ]; then
            python -m src.main --palavra "$PALAVRA" --modo "$MODO"
          else
            python -m src.main
          fi
        env:
          PALAVRA: ${{ inputs.palavra }}
          MODO: ${{ inputs.modo }}
          EMAIL_TESTE: ${{ inputs.email_teste }}
          AVB_REAL_CHROME: "0"   # Linux/CI usa o Chromium empacotado, não Chrome instalado
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
      - name: Commit dos resultados
        run: |
          git config user.name "vagas-bot"
          git config user.email "bot@users.noreply.github.com"
          git add data/processed/
          git diff --cached --quiet || git commit -m "Atualiza vagas $(date -u +%F)"
          git push
